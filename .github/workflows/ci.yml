#
# CI — Tests & Checks
#
# Runs on every push and every PR.
# - Lint (cargo clippy + rustfmt)
# - Rust unit tests (cargo test)
# - Python integration tests (pytest)
# - Build check (maturin build)
#

name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust lint + fmt
  rust-lint:
    name: Rust Lint & Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # - name: Clippy (warnings as errors)
      #   run: cargo clippy --all-targets --all-features -- -D warnings

  # Rust unit + integration tests
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-lint
    # multi_schema_test needs a live PostgreSQL.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ryx_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/ryx_integration_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Do NOT use `--all-features` here: enabling the `python` feature makes
      # the native test binaries fail to link against PyO3 symbols. Run the
      # crates that actually have tests, with their default features.
      - name: Run Rust tests
        run: |
          cargo test -p ryx-query --lib
          cargo test -p ryx-rs --lib --tests

      # Compile-check every feature combination (incl. `cache-redis`) without
      # linking native test binaries.
      - name: Check all features compile
        run: cargo check --workspace --all-features

  # Python integration tests  
  python-tests:
    name: Python Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: rust-lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    # PostgreSQL + pgvector for the multi-schema / vector-search integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ryx_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/ryx_integration_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # The Python project lives in ryx-python/ (the root Cargo.toml is a
      # virtual workspace), so every uv/maturin command must run there.
      - name: Install dependencies
        working-directory: ryx-python
        run: uv sync --all-extras --dev

      - name: Build and install Ryx
        working-directory: ryx-python
        run: uv run maturin develop --release

      - name: Run pytest
        working-directory: ryx-python
        run: uv run pytest tests/ -v --tb=short

      - name: Run examples smoke test
        working-directory: ryx-python
        run: |
          for f in ../examples/*.py; do
            echo "Running $f ..."
            uv run python "$f"
          done

  # Maturin build check
  build-check:
    name: Build Check (wheel)
    runs-on: ubuntu-latest
    needs: [rust-tests, python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # Root Cargo.toml is a virtual workspace → point maturin at the crate.
          args: --release --out dist --manifest-path ryx-python/Cargo.toml
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/
